[package]
name = "trovr-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
async-trait = "0.1.92"
jsonwebtoken = "9"
# Not imported directly; enables argon2's password-hash crate's OsRng via the getrandom feature.
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json = "1.0.151"
sqlx.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
sqlx = { workspace = true, features = ["migrate"] }
testcontainers.workspace = true
testcontainers-modules.workspace = true
tokio.workspace = true
wiremock = "0.6"
