[workspace]
resolver = "2"
members = [
    "crates/config",
    "crates/auth",
    "crates/storage",
    "crates/metadata",
    "crates/api",
    "crates/app",
]

[workspace.dependencies]
anyhow = "1.0.104"
config = "0.15.25"
serde = { version = "1.0.229", features = ["derive"] }
serial_test = "4.0.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "uuid", "chrono"] }
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = "1.26.1"
