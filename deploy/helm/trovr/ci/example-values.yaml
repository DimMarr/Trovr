# Values used to validate the chart in CI (not real credentials).
api:
  config:
    APP__AUTH_MODE: both
    APP__OIDC_ISSUER_URL: https://idp.example.com/realms/trovr
    APP__OIDC_CLIENT_ID: trovr
    APP__S3_ENDPOINT_URL: https://s3.example.com
    APP__S3_BUCKET: trovr
secrets:
  APP__DATABASE_URL: postgres://trovr:example@postgres:5432/trovr
  APP__JWT_PRIVATE_KEY_PEM: example-private-key
  APP__JWT_PUBLIC_KEY_PEM: example-public-key
  APP__S3_ACCESS_KEY_ID: example
  APP__S3_SECRET_ACCESS_KEY: example
ingress:
  enabled: true
  className: nginx
  tlsSecretName: trovr-tls
