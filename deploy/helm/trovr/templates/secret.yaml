{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trovr.secretName" . }}
  labels:
    {{- include "trovr.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP__DATABASE_URL: {{ required "secrets.APP__DATABASE_URL is required (or set secrets.existingSecret)" $s.APP__DATABASE_URL | quote }}
  APP__S3_ACCESS_KEY_ID: {{ required "secrets.APP__S3_ACCESS_KEY_ID is required" $s.APP__S3_ACCESS_KEY_ID | quote }}
  APP__S3_SECRET_ACCESS_KEY: {{ required "secrets.APP__S3_SECRET_ACCESS_KEY is required" $s.APP__S3_SECRET_ACCESS_KEY | quote }}
  {{- if has .Values.api.config.APP__AUTH_MODE (list "internal" "both") }}
  APP__JWT_PRIVATE_KEY_PEM: {{ required "secrets.APP__JWT_PRIVATE_KEY_PEM is required for internal sign-in" $s.APP__JWT_PRIVATE_KEY_PEM | quote }}
  APP__JWT_PUBLIC_KEY_PEM: {{ required "secrets.APP__JWT_PUBLIC_KEY_PEM is required for internal sign-in" $s.APP__JWT_PUBLIC_KEY_PEM | quote }}
  {{- else }}
  {{- /* The API always reads both keys; they are unused with OIDC only. */}}
  APP__JWT_PRIVATE_KEY_PEM: {{ $s.APP__JWT_PRIVATE_KEY_PEM | quote }}
  APP__JWT_PUBLIC_KEY_PEM: {{ $s.APP__JWT_PUBLIC_KEY_PEM | quote }}
  {{- end }}
{{- end }}
